# /etc/nginx/sites-available/abacadaba
#
# Changes from the deployed version:
#   1. location = /site.webmanifest   — sets the correct content type (ACTIVE)
#   2. location ^~ /courses/          — crawler branch for Open Graph (ACTIVE)
#   3. location ^~ /__og/             — internal proxy to the backend (ACTIVE)
#
# 2 and 3 were commented out until the backend endpoint existed - enabling them
# first would have meant every shared course link returned 502 to crawlers,
# cached on the crawler's side, which is worse than no tags. Feature 030 shipped
# GET /api/v1/og/courses/{slug} (app/routers/og.py), so they're enabled now.

server {
    listen 80;
    listen [::]:80;
    server_name abacadaba.com www.abacadaba.com api.abacadaba.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.abacadaba.com;
    ssl_certificate     /etc/letsencrypt/live/abacadaba.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abacadaba.com/privkey.pem;
    include             /etc/nginx/snippets/ssl-params.conf;
    return 301 https://abacadaba.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name abacadaba.com;
    ssl_certificate     /etc/letsencrypt/live/abacadaba.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abacadaba.com/privkey.pem;
    include             /etc/nginx/snippets/ssl-params.conf;

    root /var/www/abacadaba;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json;
    gzip_min_length 1024;

    # Vite's hashed build output. Safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # nginx 1.24 has no .webmanifest entry in mime.types (added in 1.21.5 upstream
    # but not in Ubuntu's build here), so it would be served as
    # application/octet-stream and silently ignored by every browser.
    #
    # Declaring no add_header here is deliberate: the three security headers are
    # inherited from the server block. Adding even one add_header to this location
    # would drop all three, which is why /assets/ and /index.html repeat them.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # --- Open Graph crawler branch ---
    #
    # Link-preview fetchers do not run JavaScript, so they never see meta tags
    # injected by React. This routes them to a backend endpoint that returns
    # server-rendered tags, while real browsers still get the SPA shell.
    #
    # The UA test lives inside `if` on purpose: `rewrite ... last` is one of the
    # few directives that behaves predictably there. `proxy_pass` inside `if` is
    # the well-known footgun — do not "simplify" this by proxying directly.
    #
    # GET /api/v1/og/courses/{slug} on the backend (app/routers/og.py) returns
    # HTML with og: tags. It returns the site-default card (not a 404, not the
    # draft's real title) for any slug that is not published - see
    # app/services/og.py, which reuses the same is_published-filtered query
    # the public course endpoint uses rather than a second one.
    #
    location ^~ /courses/ {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|Slackbot|WhatsApp|LinkedInBot|Discordbot|TelegramBot|Applebot|SkypeUriPreview|Iframely|redditbot|Pinterest)") {
            rewrite ^/courses/(.*)$ /__og/courses/$1 last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ^~ /__og/ {
        internal;
        proxy_pass http://127.0.0.1:8080/api/v1/og/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # --- end Open Graph crawler branch ---

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.abacadaba.com;
    ssl_certificate     /etc/letsencrypt/live/abacadaba.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abacadaba.com/privkey.pem;
    include             /etc/nginx/snippets/ssl-params.conf;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 512M;
    client_body_timeout 900s;
    proxy_read_timeout  900s;
    proxy_send_timeout  900s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        access_log off;
    }
}
