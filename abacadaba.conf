# /etc/nginx/sites-available/abacadaba
# Enable with:
#   sudo ln -s /etc/nginx/sites-available/abacadaba /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates are obtained with the webroot plugin rather than --nginx, so
# certbot never rewrites this file:
#
#   sudo mkdir -p /var/www/certbot
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d abacadaba.com -d www.abacadaba.com -d api.abacadaba.com
#
# Bring up the port 80 block FIRST, before the 443 blocks exist, or nginx will
# fail to start on missing certificate files.

# ---------------------------------------------------------------------------
# Port 80: ACME challenge + redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name abacadaba.com www.abacadaba.com api.abacadaba.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www -> apex. Keeping one canonical origin means CORS_ORIGINS stays a single
# value and the session cookie has one home.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.abacadaba.com;

    ssl_certificate     /etc/letsencrypt/live/abacadaba.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abacadaba.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://abacadaba.com$request_uri;
}

# ---------------------------------------------------------------------------
# abacadaba.com -- the React SPA, served as static files.
#
# Nothing here executes. `dist/` is built off-box and rsynced up, so the
# Droplet never runs npm and never runs a package lifecycle script.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name abacadaba.com;

    ssl_certificate     /etc/letsencrypt/live/abacadaba.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abacadaba.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/abacadaba;
    index index.html;

    server_tokens off;

    # Feature 013 adds Content-Security-Policy. These are the uncontroversial
    # subset that can go in now.
    #
    # GOTCHA: add_header does NOT inherit into a location block that declares
    # its own add_header. The /assets/ block below therefore repeats them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames here, so these are safe to cache
    # forever. A new build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy ships new assets that the
    # stale HTML doesn't reference.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # The SPA catchall. This is the line that replaces App Platform's
    # "Catchall Document" setting: refreshing on /lessons/intro-to-ratios
    # serves index.html and lets react-router handle the path, instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# api.abacadaba.com -- reverse proxy to the api container on loopback.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.abacadaba.com;

    ssl_certificate     /etc/letsencrypt/live/abacadaba.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abacadaba.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # nginx defaults to 1 MB, which would reject every video upload with a 413
    # before the request ever reached the app. This is the Droplet equivalent
    # of a PaaS ingress body limit. Raise it to match your largest lesson video.
    client_max_body_size 512M;

    # A 500 MB upload over a home uplink takes a while. These must comfortably
    # exceed the worst case or nginx kills the connection mid-transfer.
    client_body_timeout 900s;
    proxy_read_timeout  900s;
    proxy_send_timeout  900s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream the request body straight through instead of buffering the
        # whole video to nginx's disk first.
        proxy_request_buffering off;
    }

    # Health endpoint, handy for a curl from outside. Logging it separately
    # keeps uptime polling out of the main access log.
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        access_log off;
    }
}

# ---------------------------------------------------------------------------
# NOT included, deliberately: limit_req rate limiting on /auth/login.
# Feature 013 implements rate limiting in the application, with 429 responses,
# Retry-After headers, per-email as well as per-IP limits, and tests. Doing it
# here too would mask those responses and make the tests lie about production.
# Revisit only if app-level limiting proves insufficient.
# ---------------------------------------------------------------------------
